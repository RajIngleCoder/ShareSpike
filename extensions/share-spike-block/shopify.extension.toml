# Learn more about configuring your extension and Shopify extension types:
# https://shopify.dev/docs/apps/tools/cli/configuration

api_version = "2024-04"


[[extensions]]
type = "theme_app_extension"
name = "Share Spike Block"
handle = "share-spike-block"

  [extensions.build]
  dev_cmd = "npm run dev"
  build_cmd = "npm run build"
  # For theme app extensions, external may not be needed or may differ
  # external = ["react-reconciler"]

  [extensions.capabilities]
  network_access = true

  [[extensions.targeting]]
  target = "page"
  module = "./blocks/share-spike-block.liquid"
